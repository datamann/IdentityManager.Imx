@if (columnContainer?.canEdit) {
  <imx-date
    [control]="control"
    [display]="$safeNavigationMigration(columnContainer?.display)"
    [isReadonly]="!columnContainer?.canEdit"
    [min]="$safeNavigationMigration(columnContainer?.valueConstraint?.MinValue)"
    [max]="$safeNavigationMigration(columnContainer?.valueConstraint?.MaxValue)"
    [isValueRequired]="$safeNavigationMigration(columnContainer?.isValueRequired)"
    [withTime]="withTime"
    [validateOnlyOnChange]="validateOnlyOnChange"
    [isLoading]="isBusy"
    [imxIdentifierSuffix]="'-cdr-' + $safeNavigationMigration(columnContainer?.name)"
    [dateFormat]="dateFormat"
  >
  </imx-date>
} @else {
  <imx-view-property [columnContainer]="columnContainer" defaultValue="#LDS#Not set"> </imx-view-property>
}

<!-- template for read only elements-->
<ng-template #isReadonly>
  <imx-view-property [columnContainer]="columnContainer" defaultValue="#LDS#Not set"> </imx-view-property>
</ng-template>
