<div>
  {{
    property?.Type === ValType.Date
      ? ($safeNavigationMigration(
          entity
            ?.GetEntity()
            ?.GetColumn(property.ColumnName ?? '')
            ?.GetValue()
        ) | shortDate)
      : entity
          ?.GetEntity()
          ?.GetColumn(property.ColumnName ?? '')
          ?.GetDisplayValue()
  }}
</div>
<div subtitle>{{ getSubtitleText() }}</div>
